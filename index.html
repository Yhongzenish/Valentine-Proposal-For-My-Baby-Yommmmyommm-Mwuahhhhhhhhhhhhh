<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #000000;
        }
        .container {
            margin-top: 50px;
        }
        .heart-gif {
            width: 200px;
            margin: 20px;
        }
        .question {
            font-size: 30px;
            font-weight: bold;
            color: #ff4d4d;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .yes-btn {
            background-color: #ff4d4d;
            color: white;
        }
        .no-btn {
            background-color: #fffdfd;
            color: black;
            position: absolute;
        }
    </style>
    <script>
        function moveNoButton() {
            var x = Math.random() * window.innerWidth * 0.7;
            var y = Math.random() * window.innerHeight * 0.7;
            document.getElementById('no-btn').style.left = x + 'px';
            document.getElementById('no-btn').style.top = y + 'px';
        }
        function sayYes() {
            document.getElementById('message').innerHTML = "Yay! Can't wait to spend Valentine's with you! ❤️";
        }
    </script>
</head>
<body>
    <div class="container">
        <img class="heart-gif" src="milk-mocha.gif" alt="Heart GIF">
        <div class="question">Will you be my Valentine? ❤️</div>
        <div class="buttons">
            <button class="yes-btn" onclick="sayYes()">Yes</button>
            <button class="no-btn" id="no-btn" onmouseover="moveNoButton()">No</button>
        </div>
        <p id="message" style="font-size: 24px; color: #ff4d4d; font-weight: bold;"></p>
    </div>
</body>
</html>
